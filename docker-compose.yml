name: fittrack

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      # Los datos de SQL Server sobreviven a los reinicios del contenedor.
      - fittrack_sqldata:/var/opt/mssql
    # Sin ports: la base solo es accesible desde la red interna de compose.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"',
        ]
      interval: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      target: api
    ports:
      # ├Ünico puerto publicado y solo accesible desde este equipo: host 5262 -> contenedor 8080.
      - "127.0.0.1:5262:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Los documentos subidos se guardan fuera del contenedor.
      - fittrack_documentos:/app/documentos
    environment:
      ConnectionStrings__DefaultConnection: Server=db;Database=FitTrackDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      FITTRACK_RUTA_DOCUMENTOS: /app/documentos
      FITTRACK_URL_BASE: ${FITTRACK_URL_BASE:-http://localhost:5262}
      FITTRACK_ADMIN_CORREO: ${FITTRACK_ADMIN_CORREO}
      FITTRACK_ADMIN_CLAVE: ${FITTRACK_ADMIN_CLAVE}
      FITTRACK_USDA_CLAVE: ${FITTRACK_USDA_CLAVE:-}
      ASPNETCORE_ENVIRONMENT: Development

  enviador:
    build:
      context: .
      target: enviador
    depends_on:
      api:
        condition: service_started
    # Bucle simple: el Enviador revisa la cola y al terminar espera 15 segundos.
    # Con SIGTERM (docker stop) se deja terminar la ejecución en curso y no se inicia otra.
    entrypoint:
      - sh
      - -c
      - parar=0; trap 'parar=1' TERM INT; while [ "$$parar" = 0 ]; do dotnet FitTrack.Enviador.dll; [ "$$parar" = 1 ] && break; sleep 15 & wait $$!; done
    # Plazo para que la ejecución en curso acabe antes de que Docker la mate.
    stop_grace_period: 120s
    environment:
      FITTRACK_CONEXION: Server=db;Database=FitTrackDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      SMTP_MODO: ${SMTP_MODO:-consola}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PUERTO: ${SMTP_PUERTO:-}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
    # Sin ports: el enviador no expone nada, solo lee la base de datos.

volumes:
  fittrack_sqldata:
  fittrack_documentos:
